# 复制为 config.yaml 后按实际环境修改；config.yaml 已被 .gitignore 排除。
# app_secret 生成方式：openssl rand -hex 32

server:
  listen: ":8700"
  # 对外访问地址（反代后的 HTTPS 域名），不能以 / 结尾
  external_url: "https://auth.example.com"
  static_dir: "web/static"
  # 部署在 Nginx 等反代后设为 true，限流将从 X-Real-IP 取真实客户端 IP
  trust_proxy: false

wecom:
  corpid: "wwYourCorpID"
  agentid: 1000002
  secret: "YourSelfBuiltAppSecret"
  # qrcode = PC 浏览器扫码（wwlogin）；inside = 企业微信内置浏览器网页授权
  mode: "qrcode"
  # 本地演练开关：true 时不访问企业微信真实接口，/login 直接进入模拟扫码页
  mock: false
  # true 时调用通讯录接口补全姓名（要求应用有通讯录读取权限）
  fetch_name: false
  # true 时额外获取成员档案：部门（含名称换算）、邮箱/企业邮箱、员工编码、别名（含姓名）
  # 要求应用有通讯录读取权限；档案取不到时不阻断登录
  fetch_profile: false
  # 通讯录 Secret（可选，企微后台「管理工具 → 通讯录同步」查看）
  # 2022-06-20 后创建的自建应用，user/get 不再返回邮箱等敏感字段，配置本项后可获取；须在企微后台配置服务器 IP 白名单
  contact_secret: ""
  # 员工编码取自成员扩展属性的字段名（企微后台通讯录成员详情中的自定义字段），默认「员工编码」
  # 扩展属性中找不到同名字段时 job_number 返回空串，不报错、不阻断登录
  job_number_extattr: "员工编码"

ttl:
  state: 300s
  ticket: 60s
  verify_ts_skew: 60s

# 短时效存储：memory（默认，单实例进程内存）；redis（多实例部署时切换，要求 Redis 6.2+ 支持 GETDEL）
store:
  driver: "memory"
  redis:
    addr: "127.0.0.1:6379"
    password: ""
    db: 0

# 安全审计日志：开启后登录发起、ticket 签发/兑换及 state 失败、重放、错签等事件独立落盘为 JSON 行
# 注意：Docker 部署启用时须为审计文件挂载可写目录（镜像内以非 root 运行）
audit:
  enabled: false
  path: "audit.log"

# 监控页：开启后访问 https://auth域名/status?token=xxx 查看登录统计与运行状态（数据接口 /api/status）
# token 建议用 openssl rand -hex 16 生成；data_path 为统计持久化文件，Docker 部署需挂载可写目录
status:
  enabled: false
  token: "REPLACE_WITH_openssl_rand_hex_16"
  data_path: "status-metrics.json"

# 业务系统白名单：app 标识 -> 回调域名。请求参数中永远不接受完整 URL。
# domain 支持 https（推荐）与 http（仅建议内网使用，ticket 将明文传输，启动时有 Warn 提示）
apps:
  oa:
    domain: "https://oa.example.com"
    callback_path: "/sso/login"
    app_secret: "REPLACE_WITH_openssl_rand_hex_32_aaaaaaaaaaaaaaaa"
  itdb:
    domain: "https://it.example.com"
    callback_path: "/sso/login"
    app_secret: "REPLACE_WITH_openssl_rand_hex_32_bbbbbbbbbbbbbbbb"

ratelimit:
  login_per_minute: 30
  verify_per_minute: 120
